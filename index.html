<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viettel Money | Lịch sử giao dịch</title><style>*{box-sizing:border-box}body{font:15px system-ui,Arial;margin:0;background:#f8f9fb;color:#191919}.wrap{max-width:1050px;margin:auto;padding:32px 18px}h1{font-size:30px;margin:0 0 24px}.search{width:100%;padding:17px;border:1px solid #ddd;border-radius:12px;font-size:16px;background:white}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}.chip{border:1px solid transparent;background:#eee;padding:12px 18px;border-radius:9px;cursor:pointer;font-size:15px}.chip.active{border-color:#fa0044;background:#fff0f4;color:#ed0042}.chip.mark{color:#e6003e}.layout{position:relative}.menu{position:absolute;z-index:5;top:0;left:0;width:min(430px,100%);background:white;padding:22px;border-radius:18px;box-shadow:0 12px 35px #0002;border:1px solid #eee}.menu h2{font-size:21px;margin:0 0 22px}.option{display:flex;gap:12px;align-items:center;padding:12px 4px;cursor:pointer}.option input{width:21px;height:21px;accent-color:#f03}.actions{display:flex;gap:12px;border-top:1px solid #eee;padding-top:20px;margin-top:14px}.actions button{flex:1;padding:12px;border-radius:10px;font-size:16px;cursor:pointer;border:1px solid #ddd;background:white}.actions .primary{background:#f03;border-color:#f03;color:white}.dates{display:flex;gap:10px;margin-bottom:12px}.dates label{flex:1;font-size:13px;color:#777}.dates input{display:block;width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin-top:6px}.cards{display:grid;gap:16px}.card{background:white;border:1px solid #ddd;border-radius:20px;padding:22px;box-shadow:0 6px 18px #00000009}.cardtop{display:flex;gap:20px;justify-content:space-between;align-items:start}.ico{font-size:30px;border-right:2px solid #f03;padding:15px 24px 15px 0}.details{flex:1;display:grid;gap:12px}.details div{display:flex;gap:10px;flex-wrap:wrap}.details span{color:#777;min-width:125px}.right{text-align:right;min-width:130px}.right strong{display:block;margin:12px 0}.status{font-weight:600}.status.ok{color:#079663}.status.pending{color:#ae5b00}.status.failed{color:#cc2244}.outline{border:1px solid #c76600;color:#b75c00;border-radius:10px;padding:11px 18px;background:white;cursor:pointer;margin-top:16px}.empty{text-align:center;padding:55px;background:white;border-radius:18px;color:#777}.summary{margin:0 0 14px;color:#666;font-size:14px}.small{font-size:12px;color:#777}.close{float:right;border:0;background:none;font-size:22px;cursor:pointer}.overlay{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:10;padding:16px}.modal{background:white;border-radius:18px;padding:24px;max-width:440px;width:100%}.hidden{display:none}@media(max-width:650px){.wrap{padding:20px 12px}h1{font-size:25px}.cardtop{flex-wrap:wrap}.right{width:100%;text-align:left;padding-left:65px}.ico{padding-right:12px}.menu{position:relative}.dates{flex-wrap:wrap}}</style></head><body><main class="wrap"><h1>Lịch sử giao dịch</h1><input id="search" class="search" placeholder="⌕  Nhập mã giao dịch" aria-label="Nhập mã giao dịch"><nav id="toolbar" class="toolbar"></nav><div class="layout"><section id="menu" class="menu hidden"></section><p id="summary" class="summary"></p><section id="cards" class="cards"></section></div></main><div id="overlay" class="overlay hidden"><div class="modal"><button class="close" onclick="overlay.classList.add('hidden')">×</button><div id="modalBody"></div><button class="outline" onclick="overlay.classList.add('hidden')">Đóng</button></div></div><script>
const data=[{id:'VM261107001234',service:'Nạp điện thoại',type:'Data 4G/5G',gb:2,status:'Đang xử lý',date:'2026-11-11',time:'14:30',amount:100000,desc:'Mệnh giá 100.000đ'},{id:'VM261107001235',service:'Nạp điện thoại',type:'Combo Data',gb:6,status:'Thành công',date:'2026-11-07',time:'14:30',amount:120000,desc:'Combo 6GB'},{id:'VM261105001236',service:'Mua thẻ cào',type:'Khác',gb:0,status:'Thành công',date:'2026-11-05',time:'09:15',amount:500000,desc:'Viettel · 500.000đ'},{id:'VM261103001237',service:'Nạp điện thoại',type:'Nước ngoài',gb:12,status:'Thất bại',date:'2026-11-03',time:'11:00',amount:180000,desc:'Data quốc tế 12GB'},{id:'VM261101001238',service:'Nạp điện thoại',type:'Data 4G/5G',gb:4,status:'Thành công',date:'2026-11-01',time:'16:20',amount:90000,desc:'Data 4GB'},{id:'VM261025001239',service:'Nạp điện thoại',type:'Combo Data',gb:8,status:'Đang xử lý',date:'2026-10-25',time:'10:10',amount:150000,desc:'Combo 8GB'}];
const defs={service:{label:'Dịch vụ',title:'Lọc Dịch Vụ',options:['Nạp điện thoại','Mua thẻ cào']},type:{label:'Loại Data',title:'Lọc Loại Data',options:['Data 4G/5G','Combo Data','Nước ngoài','Khác']},capacity:{label:'Dung lượng',title:'Lọc Dung Lượng',options:['≤2GB','>2–4GB','>4–8GB','>8GB']},status:{label:'Trạng thái',title:'Lọc Trạng Thái',options:['Thành công','Đang xử lý','Thất bại']},time:{label:'Thời gian',title:'Lọc Thời Gian',options:['3 ngày trước','7 ngày trước','15 ngày trước','30 ngày trước','90 ngày trước']}};
let applied={service:[],type:[],capacity:[],status:[],time:[],from:'',to:''},draft={},open='',searchText='';const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x)),money=n=>n.toLocaleString('vi-VN')+'đ';const dayOffset=n=>{let d=new Date('2026-11-11T12:00:00');d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
function toolbar(){ $('toolbar').innerHTML=['service','type','capacity','status'].map(k=>'<button class="chip '+(applied[k].length?'mark':'')+(open===k?' active':'')+'" onclick="openMenu(\\''+k+'\\')">'+defs[k].label+(applied[k].length?' ('+applied[k].length+')':'')+' ﹀</button>').join('')+'<div style="flex-basis:100%;font-weight:600;margin-top:6px">Thời gian</div>'+defs.time.options.map(v=>'<button class="chip '+(applied.time.includes(v)?'active':'')+'" onclick="quickTime(\\''+v+'\\')">'+v+'</button>').join('')+'<button class="chip '+((applied.from||applied.to)?'active':'')+'" onclick="openMenu(\\'time\\')">Tùy chọn ngày 📅</button>'}
function quickTime(v){applied.time=applied.time.includes(v)?[]:[v];applied.from='';applied.to='';open='';$('menu').classList.add('hidden');toolbar();render()}
function openMenu(k){if(open===k){open='';$('menu').classList.add('hidden');toolbar();return}open=k;draft=clone(applied);renderMenu();toolbar()}
function renderMenu(){if(!open)return;let keys=open==='all'?Object.keys(defs):[open];$('menu').classList.remove('hidden');$('menu').innerHTML='<button class="close" onclick="openMenu(\''+open+'\')">×</button>'+keys.map(k=>'<h2>'+defs[k].title+'</h2>'+(k==='time'?'<div class="dates"><label>Từ ngày<input type="date" value="'+draft.from+'" onchange="setDate(\'from\',this.value)"></label><label>Đến ngày<input type="date" value="'+draft.to+'" onchange="setDate(\'to\',this.value)"></label></div>':'')+defs[k].options.map(v=>'<label class="option"><input type="'+(k==='time'?'radio':'checkbox')+'" name="'+k+'" '+(draft[k].includes(v)?'checked':'')+' onchange="toggle(\''+k+'\',\''+v+'\')">'+v+'</label>').join('')).join('')+'<div class="actions"><button onclick="clearDraft()">Xóa</button><button class="primary" onclick="apply()">Áp dụng</button></div>'}
function setDate(k,v){draft[k]=v;draft.time=[];renderMenu()}
function toggle(k,v){if(k==='time'){draft.time=[v];draft.from='';draft.to=''}else draft[k]=draft[k].includes(v)?draft[k].filter(x=>x!==v):[...draft[k],v];renderMenu()}
function clearDraft(){for(const k of (open==='all'?Object.keys(defs):[open]))draft[k]=[];if(open==='all'||open==='time'){draft.from='';draft.to=''}renderMenu()}
function apply(){if(draft.from&&draft.to&&draft.from>draft.to){alert('Ngày bắt đầu không được sau ngày kết thúc');return}applied=clone(draft);open='';$('menu').classList.add('hidden');toolbar();render()}
function cap(g){return g<=2?'≤2GB':g<=4?'>2–4GB':g<=8?'>4–8GB':'>8GB'}
function render(){let filtered=data.filter(d=>(!searchText||d.id.toLowerCase().includes(searchText))&&(!applied.service.length||applied.service.includes(d.service))&&(!applied.type.length||applied.type.includes(d.type))&&(!applied.capacity.length||applied.capacity.includes(cap(d.gb)))&&(!applied.status.length||applied.status.includes(d.status))&&(!applied.time.length||d.date>=dayOffset(Number(applied.time[0].split(' ')[0])))&&(!applied.from||d.date>=applied.from)&&(!applied.to||d.date<=applied.to));$('summary').textContent='Hiển thị '+filtered.length+' / '+data.length+' giao dịch · Dữ liệu minh họa';$('cards').innerHTML=filtered.length?filtered.map(d=>'<article class="card"><div class="cardtop"><div class="ico">▯<span style="color:#f03">+</span></div><div class="details"><div><span>'+d.service+'</span><b>'+d.desc+'</b></div><div><span>Thuê bao nhận</span><b>097****321</b></div><div><span>Mã giao dịch</span><b>'+d.id+'</b> <button onclick="navigator.clipboard?.writeText(\''+d.id+'\')">Sao chép</button></div><div><span>Loại Data</span>'+d.type+' · '+d.gb+'GB</div></div><div class="right"><small>'+d.time+' · '+d.date.split('-').reverse().join('/')+'</small><strong>'+money(d.amount)+'</strong><span class="status '+(d.status==='Thành công'?'ok':d.status==='Thất bại'?'failed':'pending')+'">'+d.status+'</span></div></div><button class="outline" onclick="detail(\''+d.id+'\')">Xem chi tiết giao dịch</button></article>').join(''):'<div class="empty"><h2>Không tìm thấy giao dịch</h2><p>Thử điều chỉnh điều kiện hoặc xóa bộ lọc.</p><button class="outline" onclick="reset()">Xóa tất cả bộ lọc</button></div>'}
function detail(id){let d=data.find(x=>x.id===id);$('modalBody').innerHTML='<h2>Chi tiết giao dịch</h2><p><b>Mã:</b> '+d.id+'</p><p><b>Dịch vụ:</b> '+d.service+'</p><p><b>Gói:</b> '+d.desc+'</p><p><b>Số tiền:</b> '+money(d.amount)+'</p><p><b>Trạng thái:</b> '+d.status+'</p><p class="small">Dữ liệu mô phỏng, không kết nối giao dịch thực.</p>';$('overlay').classList.remove('hidden')}
function reset(){applied={service:[],type:[],capacity:[],status:[],time:[],from:'',to:''};$('search').value='';searchText='';toolbar();render()}
$('search').addEventListener('input',e=>{searchText=e.target.value.trim().toLowerCase();render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){open='';$('menu').classList.add('hidden');$('overlay').classList.add('hidden');toolbar()}});toolbar();render();
</script></body></html>
